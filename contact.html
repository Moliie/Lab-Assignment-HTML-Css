</head>

<body>

    <form>

        <br><br>

        <label>Your Hobbies:</label><br>

        <input type="checkbox"> Drawing<br>
        <input type="checkbox"> Gaming<br>
        <br>

        <button type="submit">Submit</button>
    </form>

    <img src="Images/pic4.jpg" width="250">
</body>
